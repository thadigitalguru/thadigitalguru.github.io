# Site settings - Updated to force rebuild
title: Titus Kores - Technical SEO for Google & AI Search
description: Technical SEO consultant helping SaaS & e-commerce rank in Google and get cited in AI answers. Technical audits, AEO strategy, GSC data sprints.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://thadigitalguru.github.io" # TODO: change to https://www.yourdomain.com when custom domain is live

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git/
  - temp/
  - BLOG_GUIDE.md
  - new-post.sh
  - README.md
  - LICENSE
  - scripts

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Force rebuild timestamp
timestamp: 2026-01-30-08-35

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Titus Kores"
      comments: true
      share: true
      related: true
      categories: [Digital Marketing, SEO]
      tags: [Digital Marketing, SEO, Content Strategy]

# Site author
author:
  name: Titus Kores
  email: ntimama2@gmail.com

# Site navigation
navigation:
  - title: Home
    url: /
  - title: Services
    url: /services.html
  - title: Blog
    url: /blog.html
  - title: Contact
    url: /contact.html

# Site footer
footer:
  copyright: "© 2026 Titus Kores. All rights reserved."

# Site header and logo configuration
header:
  image: "/assets/img/profile-pic.jpg"
  image_description: "Titus Kores - Digital Marketing Expert"
  logo: "/assets/img/profile-pic.jpg"
  logo_size: 50px
  round_logo: true
  show_name: true

# Site social links
social:
  twitter: https://x.com/thadigitalguru
  linkedin: https://www.linkedin.com/in/titus-kores-610201200/
  instagram: thadigitalguru
  youtube: thadigitalguru
  medium: thadigitalguru
  github: thadigitalguru

# Site analytics (optional)
analytics:
  google: # Add your Google Analytics ID here

gtm: GTM-MSFHGJTB

# Site search (optional)
search: true

# Site comments (optional)
comments:
  provider: disqus
  shortname: # Add your Disqus shortname here

# Feed settings
feed_show_excerpt: true
feed_show_tags: true
excerpt_length: 50

# Date format
date_format: "%B %-d, %Y"

# Site JavaScript
site-js:
  - "/assets/js/theme.js"
