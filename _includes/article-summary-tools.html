{% if page.layout == "post" %}
<div class="article-summary-tools" data-summary-tools data-article-url="{{ page.url | absolute_url }}">
  <div class="article-summary-tools__label">Summarize with AI</div>
  <div class="article-summary-tools__buttons" role="group" aria-label="Summarize this article with AI">
    <button type="button" class="article-summary-tools__button" style="--tool-accent:#10A37F" data-summary-tool data-tool-name="ChatGPT" data-tool-url="https://chatgpt.com/" data-tool-compose-url="https://chatgpt.com/?q=${prompt}">
      <span class="article-summary-tools__icon article-summary-tools__icon--chatgpt" aria-hidden="true">
        <img src="https://cdn.simpleicons.org/openai/10A37F?viewbox=auto" alt="" />
      </span>
      <span class="article-summary-tools__text">ChatGPT</span>
    </button>
    <button type="button" class="article-summary-tools__button" style="--tool-accent:#2F6CFF" data-summary-tool data-tool-name="Perplexity" data-tool-url="https://www.perplexity.ai/" data-tool-compose-url="https://www.perplexity.ai/search?q=${prompt}">
      <span class="article-summary-tools__icon article-summary-tools__icon--perplexity" aria-hidden="true">
        <img src="https://cdn.simpleicons.org/perplexity/2F6CFF?viewbox=auto" alt="" />
      </span>
      <span class="article-summary-tools__text">Perplexity</span>
    </button>
    <button type="button" class="article-summary-tools__button" style="--tool-accent:#FF8A4C" data-summary-tool data-tool-name="Claude" data-tool-url="https://claude.ai/" data-tool-compose-url="https://claude.ai/new?q=${prompt}">
      <span class="article-summary-tools__icon article-summary-tools__icon--claude" aria-hidden="true">
        <img src="https://cdn.simpleicons.org/anthropic/FF8A4C?viewbox=auto" alt="" />
      </span>
      <span class="article-summary-tools__text">Claude</span>
    </button>
    <button type="button" class="article-summary-tools__button" style="--tool-accent:#A3A3A3" data-summary-tool data-tool-name="Grok" data-tool-url="https://grok.com/" data-tool-compose-url="https://grok.com/?q=${prompt}">
      <span class="article-summary-tools__icon article-summary-tools__icon--grok" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img" focusable="false" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
            <path d="M17.3 4.7L6.7 19.3" />
            <path d="M8.4 7.6c1.1-1 2.6-1.6 4.2-1.6 3.4 0 6.2 2.8 6.2 6.2 0 1.6-.6 3.1-1.6 4.2" />
            <path d="M15.6 16.4c-1.1 1-2.6 1.6-4.2 1.6-3.4 0-6.2-2.8-6.2-6.2 0-1.6.6-3.1 1.6-4.2" />
          </g>
        </svg>
      </span>
      <span class="article-summary-tools__text">Grok</span>
    </button>
  </div>
</div>
{% endif %}
