<header class="site-header">
  <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
  {% assign current_url = page.url | replace: '/index.html', '/' %}
  <nav class="site-nav" aria-label="Main navigation">
    {% for link in site.navigation %}
    <a href="{{ link.url | relative_url }}"{% if current_url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
    {% endfor %}
  </nav>
  <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Switch to light theme">
    <span id="theme-icon" aria-hidden="true">Light</span>
  </button>
</header>
