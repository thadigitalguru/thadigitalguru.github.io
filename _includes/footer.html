<footer class="site-footer">
  <nav class="footer-links" aria-label="Footer navigation">
    <a href="{{ '/blog.html' | relative_url }}">Blog</a>
    <a href="https://github.com/{{ site.social.github }}">GitHub</a>
    <a href="{{ site.social.twitter }}">X</a>
    <a href="{{ site.social.linkedin }}">LinkedIn</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </nav>
  {% for file in page.footer-extra %}
    {% include {{ file }} %}
  {% endfor %}
  <p>© {{ site.time | date: '%Y' }} {{ site.author.name }}. All rights reserved.</p>
</footer>
