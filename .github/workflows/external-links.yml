name: External Link Check

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-external-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Build Jekyll site
      run: bundle exec jekyll build
      env:
        JEKYLL_ENV: production

    - name: Check external links
      id: links
      run: bundle exec ruby scripts/check-html.rb --external

    - name: Create issue on failure
      if: ${{ failure() && steps.links.outcome == 'failure' }}
      uses: actions/github-script@v6
      with:
        script: |
          const title = '🔗 Broken External Links Detected';
          const body = `External link check failed on ${new Date().toDateString()}.

          Please review the workflow run for details:
          ${context.payload.repository.html_url}/actions/runs/${context.runId}

          Common causes:
          - External sites are temporarily down
          - URLs have changed or been removed
          - Rate limiting from external sites

          ---
          *This issue was automatically created by the External Link Check workflow.*`;

          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'link-check',
            per_page: 100
          });
          if (issues.some(issue => issue.title === title)) return;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['automated', 'link-check']
          });

    - name: Build summary
      if: always()
      run: |
        echo "## External link check" >> "$GITHUB_STEP_SUMMARY"
        echo "Result: ${{ steps.links.outcome }}" >> "$GITHUB_STEP_SUMMARY"
        echo "Social media destinations and HTTP 429/503 responses are excluded to avoid transient rate-limit alerts." >> "$GITHUB_STEP_SUMMARY"
