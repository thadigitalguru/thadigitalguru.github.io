name: Jekyll Site CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Verify site
      id: verify
      run: bash scripts/verify.sh
      env:
        JEKYLL_ENV: production

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: site-build
        path: _site/
        retention-days: 7

    - name: Build summary
      if: always()
      run: |
        echo "## Site verification" >> "$GITHUB_STEP_SUMMARY"
        echo "Result: ${{ steps.verify.outcome }}" >> "$GITHUB_STEP_SUMMARY"
        echo "Checks: Jekyll build, UI regressions, navigation, HTML/assets/links, structured data, sitemap, and feed." >> "$GITHUB_STEP_SUMMARY"
